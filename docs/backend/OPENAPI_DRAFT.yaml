openapi: 3.1.0
info:
  title: BabyLove Commerce API
  version: 1.0.0-draft
  description: Production REST contract. The backend controls catalog pricing, discounts, stock, tax, shipping, reservations, and order state; JSON Server and browser storage are not supported contracts.
servers:
  - url: https://api.babylove.example
  - url: http://localhost:8080
paths:
  /api/v1/auth/register:
    post:
      tags: ["Authentication"]
      operationId: post_api_v1_auth_register
      summary: "Register a customer account"
      x-roles: ["public"]
      x-frontend-reference: "FR-AUTH-REGISTER"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '422': { $ref: '#/components/responses/Error422' }
        '429': { $ref: '#/components/responses/Error429' }
        '500': { $ref: '#/components/responses/Error500' }
  /api/v1/auth/login:
