components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    adminBearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    guestCartAuth: { type: apiKey, in: header, name: X-Guest-Cart-Token }
    providerSignature: { type: apiKey, in: header, name: X-Provider-Signature }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
          example: { success: true, message: Request completed successfully, data: { id: example_01 } }
    Error400: { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Error401: { description: Unauthorized or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Error403: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Error404: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Error409: { description: Conflict or out of stock, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Error422: { description: Business validation failure, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Error429: { description: Rate limit exceeded, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Error500: { description: Internal server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties: { success: { type: boolean, const: true }, message: { type: string }, data: {}, meta: { $ref: '#/components/schemas/PaginationMeta' } }
    ErrorEnvelope:
      type: object
      required: [success, message, code, requestId]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        code: { type: string, enum: [VALIDATION_ERROR, UNAUTHORIZED, INVALID_TOKEN, EXPIRED_TOKEN, FORBIDDEN, NOT_FOUND, DUPLICATE_RESOURCE, CONFLICT, INVALID_VARIANT, OUT_OF_STOCK, INVALID_COUPON, EXPIRED_COUPON, PAYMENT_FAILED, UPLOAD_FAILED, UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL_ERROR] }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        requestId: { type: string }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage]
      properties: { page: { type: integer, minimum: 1 }, limit: { type: integer, minimum: 1, maximum: 100 }, total: { type: integer, minimum: 0 }, totalPages: { type: integer, minimum: 0 }, hasNextPage: { type: boolean }, hasPreviousPage: { type: boolean } }
    Money: { type: object, required: [amount, currency], properties: { amount: { type: string, pattern: '^\\d+(\\.\\d{2})?$' }, currency: { type: string, enum: [USD, EGP] } } }
    User: { type: object, required: [id, email, username], properties: { id: { type: string }, email: { type: string, format: email }, username: { type: string }, firstName: { type: string }, lastName: { type: string }, preferences: { type: object, properties: { language: { type: string, enum: [en, ar] }, currency: { type: string, enum: [USD, EGP] } } } } }
    Product: { type: object, required: [id, slug, status], properties: { id: { type: string }, slug: { type: string }, status: { type: string, enum: [draft, active, archived] }, priceRange: { type: object, properties: { min: { $ref: '#/components/schemas/Money' }, max: { $ref: '#/components/schemas/Money' } } }, variants: { type: array, items: { $ref: '#/components/schemas/Variant' } } } }
    Variant: { type: object, required: [id, sku, price], properties: { id: { type: string }, sku: { type: string }, price: { $ref: '#/components/schemas/Money' }, attributes: { type: array, items: { type: object } }, availability: { $ref: '#/components/schemas/Availability' } } }
    Availability: { type: object, properties: { status: { type: string, enum: [in_stock, low_stock, out_of_stock, backorder] }, canPurchase: { type: boolean }, maxQuantity: { type: integer } } }
    WardrobeItem:
      type: object
      required: [id, type, visibility, createdAt]
      properties: { id: { type: string }, type: { type: string, enum: [product, upload] }, productId: { type: [string, 'null'] }, variantId: { type: [string, 'null'] }, mediaId: { type: [string, 'null'] }, title: { type: string }, notes: { type: string }, tags: { type: array, items: { type: string } }, category: { type: string }, color: { type: string }, season: { type: string, enum: [spring, summer, autumn, winter, all_season] }, visibility: { type: string, enum: [private] }, createdAt: { type: string, format: date-time } }
    MediaUploadSession: { type: object, required: [mediaId, uploadUrl, expiresAt], properties: { mediaId: { type: string }, uploadUrl: { type: string, format: uri }, uploadHeaders: { type: object, additionalProperties: { type: string } }, expiresAt: { type: string, format: date-time } } }
    BodyZone:
      type: object
      required: [id, slug, labels, hotspot, isActive, displayOrder]
      properties: { id: { type: string }, slug: { type: string, enum: [head, upper_body, full_body, lower_body, hands, feet, accessories] }, labels: { type: object, required: [en, ar], properties: { en: { type: string }, ar: { type: string } } }, hotspot: { $ref: '#/components/schemas/BodyZoneHotspot' }, categoryMappings: { type: array, items: { type: object } }, isActive: { type: boolean }, displayOrder: { type: integer } }
    BodyZoneHotspot: { type: object, required: [hotspotIdentifier, svgRegionKey, desktop], properties: { hotspotIdentifier: { type: string }, svgRegionKey: { type: string }, desktop: { $ref: '#/components/schemas/PercentRect' }, mobile: { $ref: '#/components/schemas/PercentRect' } } }
    PercentRect: { type: object, required: [x, y, width, height], properties: { x: { type: number, minimum: 0, maximum: 100 }, y: { type: number, minimum: 0, maximum: 100 }, width: { type: number, minimum: 0, maximum: 100 }, height: { type: number, minimum: 0, maximum: 100 } } }
    RegisterRequest: { type: object, required: [username, email, password, firstName, lastName], properties: { username: { type: string, minLength: 3, maxLength: 40 }, email: { type: string, format: email }, password: { type: string, minLength: 12, format: password }, firstName: { type: string }, lastName: { type: string }, language: { type: string, enum: [en, ar] }, currency: { type: string, enum: [USD, EGP] } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, format: password }, rememberMe: { type: boolean } } }
    AuthActionRequest: { type: object, additionalProperties: true }
    CartRequest: { type: object, properties: { productId: { type: string }, variantId: { type: string }, quantity: { type: integer, minimum: 1, maximum: 99 }, code: { type: string } } }
    CheckoutRequest: { type: object, additionalProperties: true, description: Server calculates all order totals and ignores client price/tax/shipping fields. }
    ReviewRequest: { type: object, properties: { rating: { type: integer, minimum: 1, maximum: 5 }, title: { type: string }, body: { type: string }, mediaIds: { type: array, items: { type: string } } } }
    WardrobeRequest: { type: object, properties: { productId: { type: string }, variantId: { type: string }, mediaId: { type: string }, title: { type: string, maxLength: 140 }, notes: { type: string, maxLength: 2000 }, tags: { type: array, maxItems: 20, items: { type: string } }, category: { type: string }, color: { type: string }, season: { type: string, enum: [spring, summer, autumn, winter, all_season] }, visibility: { type: string, enum: [private] } } }
    UploadRequest: { type: object, required: [purpose, fileName, contentType, sizeBytes], properties: { purpose: { type: string, enum: [avatar, product_image, category_image, brand_logo, collection_image, review_image, wardrobe_image, home_banner, body_zone_asset] }, fileName: { type: string }, contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }, sizeBytes: { type: integer, maximum: 10485760 }, visibility: { type: string, enum: [public, private] } } }
    BodyZoneRequest: { type: object, properties: { slug: { type: string, enum: [head, upper_body, full_body, lower_body, hands, feet, accessories] }, labels: { type: object, properties: { en: { type: string }, ar: { type: string } } }, hotspot: { $ref: '#/components/schemas/BodyZoneHotspot' }, categoryId: { type: string }, subcategoryId: { type: string }, mediaId: { type: string }, isActive: { type: boolean }, displayOrder: { type: integer } } }
    AdminOperationRequest: { type: object, additionalProperties: true, description: Admin input is endpoint-specific and constrained in API_ENDPOINTS.md. }
    MutationRequest: { type: object, additionalProperties: true }

