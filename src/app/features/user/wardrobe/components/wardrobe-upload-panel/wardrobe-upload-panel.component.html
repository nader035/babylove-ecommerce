<section
  class="grid gap-6 rounded-2xl border border-brand-surface/70 bg-white p-5 shadow-sm md:grid-cols-[minmax(0,0.9fr)_minmax(0,1.1fr)] md:p-6"
>
  <div class="flex flex-col justify-between gap-5">
    <div>
      <span class="section-kicker">{{ 'wardrobe.uploadTitle' | transloco }}</span>
      <h2 class="mt-3 text-xl font-bold text-brand-primary">
        {{ 'wardrobe.uploadSubtitle' | transloco }}
      </h2>
    </div>

    <label
      class="group flex min-h-56 cursor-pointer flex-col items-center justify-center rounded-2xl border border-dashed border-brand-primary/20 bg-brand-bg-light p-6 text-center transition hover:border-brand-accent hover:bg-white"
    >
      <input
        #fileInput
        type="file"
        accept="image/*"
        class="hidden"
        (change)="onFileSelected($event)"
      />

      @if (previewUrl(); as preview) {
        <img
          [src]="preview"
          [alt]="selectedFileName()"
          class="h-48 w-full rounded-xl object-cover shadow-sm"
        />
        <p class="mt-3 max-w-full truncate text-xs font-semibold text-brand-primary/65">
          {{ selectedFileName() }}
        </p>
      } @else {
        <span
          class="flex h-16 w-16 items-center justify-center rounded-full bg-white text-brand-accent shadow-sm transition group-hover:scale-105"
        >
          <fa-icon [icon]="icons.upload" class="text-2xl"></fa-icon>
        </span>
        <span class="mt-4 text-sm font-bold text-brand-primary">
          {{ 'wardrobe.chooseImage' | transloco }}
        </span>
        <span class="mt-1 text-xs text-brand-primary/45">PNG, JPG, WEBP</span>
      }
    </label>
  </div>

  <div class="flex flex-col gap-4">
    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wide text-brand-primary/45">
        {{ 'wardrobe.titleLabel' | transloco }}
      </label>
      <input
        type="text"
        [value]="title()"
        (input)="title.set($any($event.target).value)"
        class="w-full rounded-xl border border-brand-surface/70 bg-brand-bg-light px-4 py-3 text-sm text-brand-primary outline-none transition focus:border-brand-accent focus:bg-white focus:ring-2 focus:ring-brand-accent/10"
      />
    </div>

    <div class="flex-1">
      <label class="mb-2 block text-xs font-bold uppercase tracking-wide text-brand-primary/45">
        {{ 'wardrobe.noteLabel' | transloco }}
      </label>
      <textarea
        [value]="note()"
        (input)="note.set($any($event.target).value)"
        rows="5"
        class="min-h-36 w-full resize-none rounded-xl border border-brand-surface/70 bg-brand-bg-light px-4 py-3 text-sm leading-6 text-brand-primary outline-none transition focus:border-brand-accent focus:bg-white focus:ring-2 focus:ring-brand-accent/10"
      ></textarea>
    </div>

    <div class="flex flex-wrap justify-end gap-3">
      @if (previewUrl()) {
        <button
          type="button"
          (click)="reset(fileInput)"
          class="rounded-full border border-brand-primary/15 px-5 py-2.5 text-xs font-bold uppercase tracking-wide text-brand-primary transition hover:bg-brand-bg-light"
        >
          {{ 'common.cancel' | transloco }}
        </button>
      }

      <button
        type="button"
        (click)="save(fileInput)"
        [disabled]="!canSave()"
        class="inline-flex items-center justify-center gap-2 rounded-full bg-brand-primary px-6 py-2.5 text-xs font-bold uppercase tracking-wide text-white transition hover:bg-brand-primary-light disabled:cursor-not-allowed disabled:opacity-45"
      >
        <fa-icon [icon]="icons.images" class="text-xs"></fa-icon>
        {{ 'wardrobe.save' | transloco }}
      </button>
    </div>
  </div>
</section>
